<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="Contact Form"
    <h1>Contact Us</h1>

 </div>
 <div>
    <section class="Contact Form"></section>
    <h2>Message Us down Below</h2>
    </div>
    
    <form>
        <div>
            <label for="Full Name">Full Name</label>
            <input type="text" id="Full Name required">
        </div>
        <br>
        
        <label for="Email">Email</label>
        <input type="text" id="Ëmail required">
        </div>
        <br>
        <div>
        <br>
            <label for="Phone Input">Phone Input</label>
            <input type="cell" id="Phone input">
        </div>
        <br>
        <div>
            <label for="'Subject">Subject</label>
            <select id="Subject">
            <option value="general">General Inquiry</option>
            <option value="support">Support</option>
            <option value="Booking Appointment">Booking Appointment</option>
            </select>
            </div>
            <br>
            <div>
                <label for="message">Message</label>
                <textarea id="Message" rows=""4></textarea>

            </div>
            <br>
            <button type="Submit">Submit</button>
            <br>
            </form>
        </selection>
        <br>
        <div>
            <div class="table-wrap">
            <h2>Available Appointment Times</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Time Slot</th>
                            <th>Availability</th>

                        </tr>
                    </thead>
                    <tbody>
                    <tr>  
                        <td>Monday</td>
                        <td>9:00 AM -11:00 AM</td>
                        <td>Available</td>
                    </tr>
                    <tr>
                        <td>Tuesday</td>
                        <td>13:00 PM - 15:00 PM</td>
                        <td>Available</td>
                    </tr>

                    <tr>
                        <td>Wednesday</td>
                        <td>10:00 AM - 12:00 PM</td>
                        <td>Available</td>
                    </tr>
                    <tr>
                        <td>Thursday</td>
                        <td>14:00 pm - 16:00 PM</td>
                        <td>Available</td>

                    </tr>
                    <tr>
                        <td>Friday</td>
                        <td>9:00 AM - 12:00 PM</td>
                        <td>Available</td>
                    </tr>
                </table>
            </div>
        </selection>

</body>
</html>
